packages:
  - apps/*
  - packages/*

catalog:
  '@trpc/client': ^11.5.0
  '@trpc/server': ^11.5.0
  '@types/node': 26.1.1
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  better-auth: ^1.6.23
  convex: ^1.42.3
  dotenv: ^17.4.2
  next: 16.2.10
  react: 19.2.7
  react-dom: 19.2.7
  tsdown: ^0.15.5
  typescript: 5.9.3
  zod: ^4.4.3

updateConfig:
  ignoreDependencies:
    - typescript

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@yuku-codegen/*'
  - '@yuku-parser/*'
  - '@yuku-toolchain/*'
  - kysely
  - lucide-react
  - rolldown-plugin-dts
  - yuku-codegen
  - yuku-parser

allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
